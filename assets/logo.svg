<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Work Logger</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B0A24" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- log page -->
  <rect x="112" y="84" width="288" height="344" rx="32" fill="#F8FAFC" filter="url(#shadow)"/>

  <!-- date header -->
  <rect x="148" y="122" width="132" height="22" rx="11" fill="#312E81"/>

  <!-- timeline -->
  <line x1="168" y1="196" x2="168" y2="372" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round"/>
  <circle cx="168" cy="196" r="17" fill="#22C55E"/>
  <circle cx="168" cy="254" r="10" fill="#6366F1"/>
  <circle cx="168" cy="312" r="10" fill="#6366F1"/>
  <circle cx="168" cy="372" r="17" fill="#F43F5E"/>

  <!-- entries -->
  <rect x="204" y="185" width="160" height="22" rx="11" fill="#334155"/>
  <rect x="204" y="244" width="132" height="20" rx="10" fill="#94A3B8"/>
  <rect x="204" y="302" width="150" height="20" rx="10" fill="#94A3B8"/>
  <rect x="204" y="361" width="112" height="22" rx="11" fill="#334155"/>
</svg>
